version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres-saga
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: default_db
    ports:
      - "5433:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    networks:
      - saga-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-saga
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - saga-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-saga
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - saga-network

networks:
  saga-network:
    driver: bridge