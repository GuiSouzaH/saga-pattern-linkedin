server:
    port: 8081

spring:
  application:
    name: booking-service
  datasource:
      url: jdbc:postgresql://localhost:5433/order_db
      username: admin
      password: admin
      driver-class-name: org.postgresql.Driver
  jpa:
      hibernate:
          ddl-auto: update
          show-sql: true
      properties:
          hibernate:
              format-sql: true
  rabbitmq:
      host: localhost
      port: 5672
      username: admin
      password: admin
