server:
  port: 8083

spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:postgresql://localhost:5433/inventory_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
